# Applies to all packaged vectored@ instances. Local administrator drop-ins
# may override these settings when a custom helper needs additional access.
[Service]
# Vectored needs to read arbitrary configured sources, SSH keys and known_hosts,
# and write configurable lock files. No filesystem path allowlist is imposed.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes

# Remove capabilities unrelated to the normal local SSH/rsync controller.
# Keep DAC and ownership capabilities for arbitrary root-readable sources and
# local helpers. Remote commands are unaffected by this local bounding set.
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_BOOT CAP_SYS_TIME CAP_SYS_TTY_CONFIG CAP_SYSLOG CAP_SYS_PACCT CAP_SYS_PTRACE CAP_AUDIT_CONTROL CAP_MAC_ADMIN CAP_MAC_OVERRIDE

LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
