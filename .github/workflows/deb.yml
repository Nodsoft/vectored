name: Build .deb (vectored)

on:
  workflow_call:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version (NBGV)
        uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
        id: nbgv

      - name: Build deb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          chmod +x ./packaging/build-deb.sh
          VERSION='${{ steps.nbgv.outputs.semver2 }}' OUT_DIR=dist ARCH=amd64 ./packaging/build-deb.sh

      - name: Verify packaged systemd hardening
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          deb=(dist/*.deb)
          dpkg-deb -x "${deb[0]}" "$tmp"
          unit_dir="$tmp/lib/systemd/system"
          cmp systemd/vectored@.service.d/10-hardening.conf "$unit_dir/vectored@.service.d/10-hardening.conf"
          # Verify parsing and drop-in discovery without installing the package.
          sed -i 's|^ExecStart=.*|ExecStart=/usr/bin/true|' "$unit_dir/vectored@.service"
          SYSTEMD_LOG_LEVEL=debug systemd-analyze verify "$unit_dir/vectored@.service" >"$tmp/verify.log" 2>&1 || {
            cat "$tmp/verify.log"
            exit 1
          }
          grep -F 'DropIn Path:' "$tmp/verify.log" | grep -F 'vectored@.service.d/10-hardening.conf'

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: vectored-deb
          path: dist/*.deb

